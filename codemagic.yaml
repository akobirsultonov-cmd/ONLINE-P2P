workflows:
  ios-unsigned:
    name: P2P Offline 2.9.4 - Reliable iCloud Folder Auto Backup
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Create AppIcon catalog
        script: |
          set -e
          rm -rf Assets.xcassets
          mkdir -p Assets.xcassets/AppIcon.appiconset

          cp Icon-20@2x.png Assets.xcassets/AppIcon.appiconset/
          cp Icon-20@3x.png Assets.xcassets/AppIcon.appiconset/
          cp Icon-29@2x.png Assets.xcassets/AppIcon.appiconset/
          cp Icon-29@3x.png Assets.xcassets/AppIcon.appiconset/
          cp Icon-40@2x.png Assets.xcassets/AppIcon.appiconset/
          cp Icon-40@3x.png Assets.xcassets/AppIcon.appiconset/
          cp Icon-60@2x.png Assets.xcassets/AppIcon.appiconset/
          cp Icon-60@3x.png Assets.xcassets/AppIcon.appiconset/
          cp Icon-1024.png Assets.xcassets/AppIcon.appiconset/

          cat > Assets.xcassets/Contents.json <<'EOF'
          {"info":{"author":"xcode","version":1}}
          EOF

          mkdir -p Assets.xcassets/LaunchBackground.colorset
          cat > Assets.xcassets/LaunchBackground.colorset/Contents.json <<'EOF'
          {
            "colors" : [
              {
                "color" : {
                  "color-space" : "srgb",
                  "components" : {
                    "alpha" : "1.000",
                    "blue" : "0.018",
                    "green" : "0.012",
                    "red" : "0.000"
                  }
                },
                "idiom" : "universal"
              }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          EOF


          cat > Assets.xcassets/AppIcon.appiconset/Contents.json <<'EOF'
          {
            "images" : [
              { "filename" : "Icon-20@2x.png", "idiom" : "iphone", "scale" : "2x", "size" : "20x20" },
              { "filename" : "Icon-20@3x.png", "idiom" : "iphone", "scale" : "3x", "size" : "20x20" },
              { "filename" : "Icon-29@2x.png", "idiom" : "iphone", "scale" : "2x", "size" : "29x29" },
              { "filename" : "Icon-29@3x.png", "idiom" : "iphone", "scale" : "3x", "size" : "29x29" },
              { "filename" : "Icon-40@2x.png", "idiom" : "iphone", "scale" : "2x", "size" : "40x40" },
              { "filename" : "Icon-40@3x.png", "idiom" : "iphone", "scale" : "3x", "size" : "40x40" },
              { "filename" : "Icon-60@2x.png", "idiom" : "iphone", "scale" : "2x", "size" : "60x60" },
              { "filename" : "Icon-60@3x.png", "idiom" : "iphone", "scale" : "3x", "size" : "60x60" },
              { "filename" : "Icon-1024.png", "idiom" : "ios-marketing", "scale" : "1x", "size" : "1024x1024" }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          EOF

      - name: Generate Xcode project
        script: |
          xcodegen generate

      - name: Build iPhone app
        script: |
          set -e
          rm -rf build
          xcodebuild \
            -project P2POffline.xcodeproj \
            -scheme P2POffline \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon \
            ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Finalize app resources
        script: |
          set -e
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -print -quit)
          test -n "$APP_PATH"
          echo "Built app: $APP_PATH"

          # Fallback icons placed directly in bundle for sideload installers/signers.
          cp Icon-20@2x.png "$APP_PATH/AppIcon20x20@2x.png"
          cp Icon-20@3x.png "$APP_PATH/AppIcon20x20@3x.png"
          cp Icon-29@2x.png "$APP_PATH/AppIcon29x29@2x.png"
          cp Icon-29@3x.png "$APP_PATH/AppIcon29x29@3x.png"
          cp Icon-40@2x.png "$APP_PATH/AppIcon40x40@2x.png"
          cp Icon-40@3x.png "$APP_PATH/AppIcon40x40@3x.png"
          cp Icon-60@2x.png "$APP_PATH/AppIcon60x60@2x.png"
          cp Icon-60@3x.png "$APP_PATH/AppIcon60x60@3x.png"

          # Ensure iOS has explicit icon metadata even if a sideload tool ignores Assets.car metadata.
          /usr/libexec/PlistBuddy -c 'Delete :CFBundleIcons' "$APP_PATH/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIcons dict' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIcons:CFBundlePrimaryIcon dict' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles array' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:0 string AppIcon20x20' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:1 string AppIcon29x29' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:2 string AppIcon40x40' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:3 string AppIcon60x60' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName string AppIcon' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Delete :CFBundleIconFiles' "$APP_PATH/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIconFiles array' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIconFiles:0 string AppIcon20x20' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIconFiles:1 string AppIcon29x29' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIconFiles:2 string AppIcon40x40' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIconFiles:3 string AppIcon60x60' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Delete :CFBundleIconName' "$APP_PATH/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIconName string AppIcon' "$APP_PATH/Info.plist"

          echo '--- Final icon metadata ---'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons' "$APP_PATH/Info.plist"
          echo '--- Final icon files ---'
          ls -lh "$APP_PATH"/AppIcon*.png

          echo '--- Install exact approved SplashBackground JPEG directly in app bundle ---'
          cp SplashBackground.jpeg "$APP_PATH/SplashBackground.jpeg"
          test -s "$APP_PATH/SplashBackground.jpeg"
          echo "SplashBackground JPEG installed: $(ls -lh "$APP_PATH/SplashBackground.jpeg")"

          # Assets.car is useful but must never be parsed with `strings` as a build gate.
          # Asset catalogs are compiled binary archives. The exact approved JPEG copied
          # directly into the app bundle above is the single deterministic splash source.
          if [ -f "$APP_PATH/Assets.car" ]; then
            echo "Assets.car present"
          else
            echo "WARNING: Assets.car not found; direct splash resource is still installed"
          fi

          test -f "$APP_PATH/AppIcon60x60@2x.png"
          test -f "$APP_PATH/AppIcon60x60@3x.png"

      - name: Create unsigned IPA
        script: |
          set -e
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -print -quit)
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry P2POffline-unsigned.ipa Payload
          rm -rf Payload

    artifacts:
      - P2POffline-unsigned.ipa
      - build/Build/Products/Release-iphoneos/*.app
